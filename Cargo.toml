[package]
name = "inbuxa-migrate"
description = "Account migration and backup for inbuxa"
version = "27.1.0-rc.14"
authors = ["Coffey Labs LLC <legal@coffeylabs.org>"]
license = "Apache-2.0 OR MIT"
repository = "https://git.coffeylabs.org/inbuxa/inbuxa-migrate"
homepage = "https://git.coffeylabs.org/inbuxa/inbuxa-migrate"
edition = "2024"
readme = "README.md"

[[bin]]
name = "inbuxa-migrate"
path = "src/main.rs"

[features]
default = ["bundled-sqlite"]
bundled-sqlite = ["rusqlite/bundled"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
indexmap = { version = "2.14.2", features = ["serde"] }
rusqlite = { version = "0.43", features = ["blob"] }
blake3 = "1.8.7"
time = { version = "0.3.55", features = ["serde-well-known", "macros"] }
url= "2.5.8"
thiserror  = "2.0.21"
ureq = { version = "3.5.2", default-features = false, features = ["json", "gzip", "rustls-no-provider", "platform-verifier"] }
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
num_cpus = "1.17.0"
encodify = "1.0.2"
mail-parser = "1.0.1"
calcard = "0.3.14"
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7.1"
regex  = "1.13.1"
flate2 = "1.1.11"
quick-xml = "0.42"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
chrono-tz = { version = "0.10.4", default-features = false }
hashify = "0.3.2"
psl = "2.1.255"
terminal_size = "0.4.4"

[dev-dependencies]
mockito = "1.7.2"
tempfile = "3.27.0"
testcontainers = { version = "0.28", features = ["blocking"] }
